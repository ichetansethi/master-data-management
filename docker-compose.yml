services:
  leads-db:
    image: postgres:16
    container_name: call-reporting-platform-leads-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - leads_db_data:/var/lib/postgresql/data

  app-config-db:
    image: postgres:16
    container_name: call-reporting-platform-app-config-db
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_USER=${APP_CONFIG_DB_USER}
      - POSTGRES_PASSWORD=${APP_CONFIG_DB_PASS}
      - POSTGRES_DB=${APP_CONFIG_DB_NAME}
    volumes:
      - app_config_db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: call-reporting-platform-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  leads_db_data:
  app_config_db_data:
  minio_data:
